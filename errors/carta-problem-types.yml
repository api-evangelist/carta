name: Carta error codes
generated: '2026-10-20'
method: searched
source: https://docs.carta.com/api-platform/guides/references/error-codes
format: google-rpc-status
envelope:
  fields:
  - code
  - message
  - details[]
  details_type: type.googleapis.com/carta.proto.publicapi.errors.v1alpha1.ErrorInfo
  reason_field: details[].reason
problems:
- status: 400
  title: Bad Request
  description: Our server did not understand your request. This might happen due to bad syntax or headers not being set correctly.
- status: 401
  title: Unauthorized
  description: 'The request is missing or has invalid authentication credentials. Reason: MISSING_OR_INVALID_ACCESS_TOKEN
    (gRPC code 16).'
  reasons:
  - MISSING_OR_INVALID_ACCESS_TOKEN
- status: 403
  title: Forbidden
  description: The access_token does not have the appropriate permission (gRPC code 7).
  reasons:
  - INSUFFICIENT_SCOPE
  - ACCESS_TO_RESOURCE_RESTRICTED
  - MISSING_INTERNAL_PERMISSION
- status: 404
  title: Not Found
  description: The requested resource was not found (code 5).
- status: 429
  title: Too Many Requests
  description: Your application has exceeded our rate limit.
- status: 500
  title: Internal Server Error
  description: An unexpected internal server error occured with Carta's server (code 13).
- status: 503
  title: Service Unavailable
  description: One or more of Carta's services might be experiencing an outage; check the status page (code 14).
