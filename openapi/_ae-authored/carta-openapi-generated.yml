components:
  schemas:
    PostV1Alpha1InvestorsFirmsFirmidFundsFundidCapitalcallsReque:
      type: object
      properties:
        interestIds:
          type: string
          description: When empty, every interest of the fund is called.
        postAsDraft:
          type: string
          description: 'When true, the capital call stays a draft: no journal is posted and no notice is sent. When false, the capital call is
            also released, the same as Approve & Release in the app: its journal is posted.'
        externalReferenceId:
          type: string
          description: Used for idempotency on externalReferenceId and sourceSystem.
        sourceSystem:
          type: string
          description: Used for idempotency on externalReferenceId and sourceSystem.
    PostV1Alpha1InvestorsFirmsFirmidFundsFundidCapitalcallsRespo:
      type: object
      properties:
        capitalCall:
          type: string
          description: The created capital call.
        replayed:
          type: string
          description: Set to true when a retry with the same payload returns the original capital call.
    PostV1Alpha1InvestorsFirmsFirmidFundsFundidManagementfeesReq:
      type: object
      properties:
        interestAmounts:
          type: string
          description: Per-interest amounts that must sum exactly to amount
        amount:
          type: string
        externalReferenceId:
          type: string
          description: Used for idempotency
        sourceSystem:
          type: string
          description: Used for idempotency
      required:
      - interestAmounts
      - amount
    PostV1Alpha1InvestorsFirmsFirmidFundsFundidManagementfeesRes:
      type: object
      properties:
        replayed:
          type: string
          description: Set to true on retry with same payload
    PostV1Alpha1IssuersIssueridSecondarytransactionsResponse:
      type: object
      properties:
        secondaryTransactionId:
          type: string
        transactionState:
          type: string
    PostV1Alpha1IssuersIssueridSecuritiesStocksplitchangesRespon:
      type: object
      properties:
        splitOccurredSince:
          type: string
        affectedAssets:
          type: string
        asOf:
          type: string
    GetV1Alpha1IssuersIssueridTransactionsResponse:
      type: object
      properties:
        transactions:
          type: string
          description: Transaction history for securities
    PostV1Alpha1OpencaptablesResponse:
      type: object
      properties:
        OpenCapTablesRecord:
          type: string
tags:
- name: V1Alpha1
