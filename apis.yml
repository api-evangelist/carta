aid: carta

name: Carta

description: Carta is an equity management platform offering a REST API for cap table management, 409A valuations, fund administration, employee
  equity plans, and investor portfolio management. Carta's Developer Platform exposes four API suites — Launch, Investor, Issuer, and Portfolio
  — authenticated via OAuth 2.0 (Authorization Code and Client Credentials flows). Partner access is invite-only and requires SOC 2 Type 2 certification;
  Carta customers may request access to their own data on demand. A mock API environment at mock-api.carta.com is provided for sandbox development.

